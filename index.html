    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Suppress benign WebSocket connection warnings from dev environment/iframe
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason;
        var msg = (reason && (reason.message || reason.toString())) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          e.preventDefault();
        }
      });
    </script>

  <body class="bg-stone-100 text-stone-900 antialiased selection:bg-amber-200">
    <div id="root"></div>
